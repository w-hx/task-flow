<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流时</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="left-panel">
      <div class="left-header">
        <span class="title">时间表</span>
        <div class="header-actions">
          <button id="btn-add" class="icon-btn" title="添加">+</button>
          <button id="btn-delete-mode" class="icon-btn" title="删除" data-symbol="−">−</button>
        </div>
      </div>
      <div class="card-list" id="card-list"></div>
    </aside>
    <main class="right-panel">
      <div id="create-panel" class="form-panel">
        <div class="form-row">
          <div class="form-group">
            <label>时间表名称</label>
            <input type="text" id="create-name" placeholder="输入时间表名称" maxlength="50">
          </div>
          <div class="form-group small">
            <label>开始提示音</label>
            <select id="create-sound-start">
              <option value="default">默认 (Beep)</option>
              <option value="chime">Chime (风铃)</option>
              <option value="success" selected>Success (成功)</option>
              <option value="alert">Alert (警告)</option>
              <option value="drop">Drop (下落)</option>
              <option value="rise">Rise (上升)</option>
              <option value="electronic">Electronic (电子)</option>
              <option value="magic">Magic (魔法)</option>
              <option value="doorbell">Doorbell (门铃)</option>
              <option value="zap">Zap (激光)</option>
            </select>
          </div>
          <div class="form-group small">
            <label>结束提示音</label>
            <select id="create-sound-end">
              <option value="default">默认 (Beep)</option>
              <option value="chime" selected>Chime (风铃)</option>
              <option value="success">Success (成功)</option>
              <option value="alert">Alert (警告)</option>
              <option value="drop">Drop (下落)</option>
              <option value="rise">Rise (上升)</option>
              <option value="electronic">Electronic (电子)</option>
              <option value="magic">Magic (魔法)</option>
              <option value="doorbell">Doorbell (门铃)</option>
              <option value="zap">Zap (激光)</option>
            </select>
          </div>
        </div>
        <div class="form-row speak-config-row">
          <div class="form-group small">
            <label>语音朗读</label>
            <select id="create-speak-voice">
              <option value="__none__">无</option>
              <option value="">系统默认</option>
            </select>
          </div>
          <div class="form-group rate-group">
            <label>语速 <span class="rate-value" id="create-rate-value">1.0x</span></label>
            <div class="rate-row">
              <input type="range" id="create-speak-rate" min="0.5" max="2" step="0.1" value="1">
              <button type="button" class="btn-preview" id="create-preview-speak" title="试听">试听</button>
            </div>
          </div>
        </div>
        <label>时间表内容</label>
        <textarea id="create-content" placeholder="粘贴时间表，格式：&#10;7:30-7:35 起床拿水壶出去&#10;7:35-7:40 刷牙、烧水、洗脸"></textarea>
        <div class="form-actions">
          <button id="create-save" class="btn-primary">保存</button>
        </div>
        <p id="create-error" class="error-msg"></p>
      </div>
      <div id="edit-panel" class="form-panel hidden">
        <div class="form-row">
          <div class="form-group">
            <label>时间表名称</label>
            <input type="text" id="edit-name" placeholder="输入时间表名称" maxlength="50">
          </div>
          <div class="form-group small">
            <label>开始提示音</label>
            <select id="edit-sound-start">
              <option value="default">默认 (Beep)</option>
              <option value="chime">Chime (风铃)</option>
              <option value="success">Success (成功)</option>
              <option value="alert">Alert (警告)</option>
              <option value="drop">Drop (下落)</option>
              <option value="rise">Rise (上升)</option>
              <option value="electronic">Electronic (电子)</option>
              <option value="magic">Magic (魔法)</option>
              <option value="doorbell">Doorbell (门铃)</option>
              <option value="zap">Zap (激光)</option>
            </select>
          </div>
          <div class="form-group small">
            <label>结束提示音</label>
            <select id="edit-sound-end">
              <option value="default">默认 (Beep)</option>
              <option value="chime">Chime (风铃)</option>
              <option value="success">Success (成功)</option>
              <option value="alert">Alert (警告)</option>
              <option value="drop">Drop (下落)</option>
              <option value="rise">Rise (上升)</option>
              <option value="electronic">Electronic (电子)</option>
              <option value="magic">Magic (魔法)</option>
              <option value="doorbell">Doorbell (门铃)</option>
              <option value="zap">Zap (激光)</option>
            </select>
          </div>
        </div>
        <div class="form-row speak-config-row">
          <div class="form-group small">
            <label>语音朗读</label>
            <select id="edit-speak-voice">
              <option value="__none__">无</option>
              <option value="">系统默认</option>
            </select>
          </div>
          <div class="form-group rate-group">
            <label>语速 <span class="rate-value" id="edit-rate-value">1.0x</span></label>
            <div class="rate-row">
              <input type="range" id="edit-speak-rate" min="0.5" max="2" step="0.1" value="1">
              <button type="button" class="btn-preview" id="edit-preview-speak" title="试听">试听</button>
            </div>
          </div>
        </div>
        <label>时间表内容</label>
        <textarea id="edit-content" placeholder="粘贴时间表"></textarea>
        <div class="form-actions">
          <button id="btn-run-toggle" class="btn-secondary hidden">开始运行</button>
          <button id="edit-save" class="btn-primary">保存</button>
        </div>
        <p id="edit-error" class="error-msg"></p>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
